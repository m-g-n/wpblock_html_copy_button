name: Create Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # プラグインのルートファイルのヘッダー（Version:）からバージョンを取得し、
      # 同じバージョンのタグが既にある（前回リリースから変わっていない）場合はリリースをスキップする
      - name: Get Version
        id: version
        run: |
          version=$(.github/scripts/get-version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # --exit-code: 0=タグあり / 2=タグなし / それ以外=取得エラー
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null || rc=$?
          case "$rc" in
            0)
              echo "::notice::バージョン $version は既にリリース済みのため、リリース作業をスキップします"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "バージョン $version をリリースします"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::タグ一覧の取得に失敗しました（exit $rc）"
              exit 1
              ;;
          esac

      #nodeのセットアップとnpmキャッシュ
      - name: Use Node.js
        if: steps.version.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies
        if: steps.version.outputs.skip == 'false'
        run: npm ci
      - name: npm run build
        if: steps.version.outputs.skip == 'false'
        run: npm run build

      #composerの実施（開発用パッケージは含めない）
      - name: Composer install
        if: steps.version.outputs.skip == 'false'
        uses: docker://composer:2
        with:
          args: install --no-dev --optimize-autoloader --no-interaction --no-progress

      # release用のzip作成（配布に必要なファイルだけを含める）
      - name: Zip Release
        if: steps.version.outputs.skip == 'false'
        run: .github/scripts/build-zip.sh mgn_wpblock_copy.zip

      # release作成とzipファイルの添付
      - name: Create Release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BODY: ${{ github.event.pull_request.body }}
        run: |
          # リリース PR 本文のうち、確認内容（release-notes-end マーカー以降）はリリースノートに含めない
          notes=$(printf '%s\n' "$RELEASE_BODY" | sed '/<!-- release-notes-end/,$d')
          # タグ名・タイトルにはルートファイルのバージョン（形式検証済み）を使う
          gh release create \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_VERSION" \
            --notes "$notes" \
            -- "$RELEASE_VERSION" ./mgn_wpblock_copy.zip

      # mainからdevにPR生成
      - name: Create pull request to dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --base dev --head main --state open --json number --jq '.[].number')" ]; then
            echo "main -> dev のPRは既に存在するためスキップ"
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "リリース残処理：mainの内容をdevへ反映" \
            --body "Pulling main into dev"
