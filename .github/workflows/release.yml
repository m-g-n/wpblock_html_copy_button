name: Create Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      #nodeのセットアップとnpmキャッシュ
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: npm run build
        run: npm run build

      #composerの実施
      - name: Composer install
        uses: docker://composer:2
        with:
          args: install

      # release用のzip作成 https://github.com/marketplace/actions/zip-release
      - name: Zip Release
        uses: TheDoctor0/zip-release@0.7.6
        with:
          filename: 'mgn_wpblock_copy.zip' # ファイル名
          exclusions: '*.git* /*node_modules/* .editorconfig /*src/*scss/*' # 除外設定
          directory: '.'
          path: '.'
          type: 'zip'

      # release作成とzipファイルの添付
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_BODY: ${{ github.event.pull_request.body }}
        run: |
          gh release create "$RELEASE_TITLE" ./mgn_wpblock_copy.zip \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_BODY"

      # mainからdevにPR生成
      - name: Create pull request to dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --base dev --head main --state open --json number --jq '.[].number')" ]; then
            echo "main -> dev のPRは既に存在するためスキップ"
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "リリース残処理：mainの内容をdevへ反映" \
            --body "Pulling main into dev"
