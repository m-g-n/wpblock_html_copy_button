name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ルートファイルの Version と readme.txt の Stable tag の一致を確認
      - name: Check version
        run: echo "Version=$(bash .github/scripts/get-version.sh)"

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --no-progress

      - name: PHPCS (WordPress Coding Standards)
        run: composer lint

  # リリース時と同じ手順で配布用 zip を作成できるか確認する
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Composer install (no-dev)
        uses: docker://composer:2
        with:
          args: install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Build zip
        run: bash .github/scripts/build-zip.sh mgn_wpblock_copy.zip

      - name: Check zip contents
        run: |
          unexpected=$(unzip -Z1 mgn_wpblock_copy.zip | cut -d/ -f1 | sort -u | grep -vxE 'mgn_wpblock_copy\.php|readme\.txt|App|dist|vendor|languages' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::配布用 zip に想定外のファイルが含まれています: $unexpected"
            exit 1
          fi
          unzip -l mgn_wpblock_copy.zip | tail -n 1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --no-progress

      # テスト用の wp-env 環境（.wp-env.test.json / PHP 8.1）を起動
      - name: Start wp-env
        run: npm run env:test -- start

      - name: PHPUnit
        run: npm run test:php

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: E2E (Playwright)
        run: npm run test:e2e

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
