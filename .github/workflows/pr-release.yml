name: Create release pull requests

on:
  pull_request:
    branches:
      - dev
    types: [closed]

jobs:
  create-release-pr:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'main') == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # プラグインのルートファイルのヘッダー（Version:）からバージョンを取得
      - name: Get Version
        id: get_version
        run: |
          version=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' mgn_wpblock_copy.php | head -n 1 | tr -d '[:space:]')
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error file=mgn_wpblock_copy.php::Version ヘッダーからバージョンを取得できません: '$version'"
            exit 1
          fi
          echo "Version=$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create a release pull request
        uses: bakunyo/git-pr-release-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_PR_RELEASE_BRANCH_PRODUCTION: main
          GIT_PR_RELEASE_BRANCH_STAGING: dev
          GIT_PR_RELEASE_LABELS: release
          PKG_VERSION: ${{ steps.get_version.outputs.version }}
          GIT_PR_RELEASE_TEMPLATE: .github/git-pr-release/.git-pr-release-template